<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maíra & David</title>

<link href="https://fonts.googleapis.com/css2?family=Simonetta&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html, body{width:100%;overflow-x:hidden;}
body{font-family:'Simonetta', serif;color:#3a3a3a;scroll-behavior:smooth;}

/* CAPA */
.capa{
  min-height:100vh;
  background:url('capa-mobile.png') center center no-repeat;
  background-size:cover;
}
@media (min-width:1024px){
  .capa{
    background:url('capa-desktop.jpg') center center no-repeat;
    background-size:cover;
  }
}

/* DATA */
.data-section{
  min-height:100vh;
  background:url('fundo-data.jpg') center center no-repeat;
  background-size:cover;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:#770003;
  position:relative;
  padding:40px 20px 120px 20px;
}

.data-section h1{font-size:42px;margin-bottom:20px;}

button{
  padding:15px 40px;
  border:none;
  border-radius:40px;
  background:#6c212f;
  color:white;
  font-size:20px;
  cursor:pointer;
  margin-top:20px;
  transition:0.3s;
  font-family:'Simonetta', serif;
}
button:hover{opacity:0.85;}

/* COUNTDOWN */
.countdown{
  display:flex;
  gap:15px;
  position:absolute;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  flex-wrap:wrap;
  justify-content:center;
  width:100%;
}

.box{
  background:rgba(255,255,255,0.9);
  backdrop-filter:blur(6px);
  padding:14px 16px;
  border-radius:18px;
  min-width:70px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,0.15);
}

.box span{display:block;font-size:22px;color:#7a4a32;}
.box p{font-size:11px;letter-spacing:2px;margin-top:5px;color:#7a4a32;}

/* SEÇÕES */
.section{padding:90px 20px;text-align:center;}
.bege{background:#f5f1ea;}
.terracota{background:#7A1E2C;color:white;}
h2{font-size:40px;margin-bottom:25px;}
.section p{font-size:22px;margin-top:10px;line-height:1.6;}

.local-img{
  width:100%;
  max-width:320px;
  border-radius:15px;
  margin:25px auto;
  display:block;
}

/* PRESENTES */
.presentes-section{
  padding:80px 20px;
  background:url('fundo-presentes.png') center center no-repeat;
  background-size:cover;
  display:flex;
  justify-content:center;
  align-items:center;
}

.icones-container{
  display:flex;
  gap:70px;
  flex-wrap:wrap;
  justify-content:center;
  text-align:center;
}

.icone-item a{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none !important;
  color:#6c212f;
  transition:0.3s;
}

.icone-item a:hover{
  transform:scale(1.08);
}

.icone-item img{
  width:110px;
  margin-bottom:4px;
}

.icone-item p{
  font-size:26px;
  font-family:'Alex Brush', cursive;
  margin-top:0;
}

/* CONFIRMAÇÃO */
.confirmacao-section{
  min-height:100vh;
  background:url('confirmacao-mobile.png') center center no-repeat;
  background-size:cover;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  text-align:center;
  padding:60px 20px 100px 20px;
  position:relative;
  color:white;
}
@media (min-width:1024px){
  .confirmacao-section{
    background:url('confirmacao-desktop.jpg') center center no-repeat;
    background-size:cover;
  }
}

.confirmacao-section::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.35);
}

.confirmacao-section > *{position:relative;z-index:1;}
.confirmacao-section h2{font-size:44px;margin-bottom:30px;}

.form-box{
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(8px);
  padding:30px;
  border-radius:20px;
  width:100%;
  max-width:350px;
}

.confirmacao-section input{
  padding:12px;
  width:100%;
  border-radius:8px;
  border:none;
  margin-bottom:15px;
  font-size:16px;
  font-family:'Simonetta', serif;
}

#mensagemSucesso{display:none;margin-top:20px;font-size:20px;}
</style>
</head>
